name: OmniRoute Runner

on:
  workflow_dispatch:   # chạy tay qua tab Actions
  schedule:
    - cron: '0 */6 * * *'   # backup: tự chạy lại mỗi 6h nếu self-trigger (bước 4) lỡ fail giữa chừng

permissions:
  actions: read
  contents: write   # cần write để push data lên branch data-store

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355   # GitHub free runner giới hạn cứng 360p (6h), chừa buffer 5p

    steps:
      # ---------- 1. Khôi phục data từ branch data-store (nếu có) ----------
      - name: Restore previous data
        run: |
          git clone --depth 1 --branch data-store \
            https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ github.repository }}.git \
            data-checkout 2>/dev/null && echo "Found data-store branch" || echo "Chưa có branch data-store, chạy như lần đầu"
          mkdir -p ./data
          if [ -d data-checkout ]; then
            cp -r data-checkout/. ./data/ 2>/dev/null || true
            rm -rf ./data/.git   # QUAN TRỌNG: bỏ .git đã clone kèm, tránh dính branch data-store vào ./data
            rm -rf data-checkout
            echo "Đã khôi phục $(du -sh ./data | cut -f1) dữ liệu"
          fi

      # ---------- 2. Chạy OmniRoute, mount data đã restore ----------
      - name: Run OmniRoute
        run: |
          mkdir -p ./data
          chmod -R 777 ./data
          docker run -d --name omniroute -p 20128:20128 \
            -v $(pwd)/data:/app/data \
            diegosouzapw/omniroute:latest
          sleep 8
          echo "----- container logs -----"
          docker logs omniroute

      # ---------- 3. Cài & kết nối chisel client vào relay server trên Render ----------
      - name: Install & connect chisel tunnel
        run: |
          CHISEL_URL=$(curl -sL https://api.github.com/repos/jpillora/chisel/releases/latest \
            | grep "browser_download_url" \
            | grep "linux_amd64.gz" \
            | cut -d '"' -f 4)
          echo "Downloading: $CHISEL_URL"
          curl -sL "$CHISEL_URL" -o chisel.gz
          gunzip chisel.gz
          chmod +x chisel
          ./chisel client https://omniroute-geff.onrender.com R:8080:localhost:20128 &
          sleep 5
          echo "Tunnel connected -> https://omniroute-geff.onrender.com"

      # ---------- 4. Chờ tới gần hết giờ, rồi snapshot data TRƯỚC khi trigger job kế tiếp ----------
      - name: Wait until near timeout
        run: sleep 20400   # ~340 phút, chừa buffer để job2 kịp lên trước khi job1 (355p) kết thúc

      # ---------- 5. Lưu data mới nhất TRƯỚC khi trigger job2, để job2 restore đúng bản mới ----------
      - name: Snapshot data before triggering next job
        if: always()
        run: |
          docker cp omniroute:/app/data/. ./data/ || true

      - name: Push data to GitHub (branch data-store)
        if: always()
        run: |
          rm -rf data-checkout
          mkdir -p data-checkout
          cp -r ./data/. data-checkout/ 2>/dev/null || true
          cd data-checkout
          git init -q
          git checkout -q -B data-store   # -B: tạo mới hoặc reset nếu đã tồn tại, không lỗi như -b
          git config user.email "actions@github.com"
          git config user.name "github-actions[bot]"
          git add -A
          git commit -q -m "Data snapshot $(date -u +%Y-%m-%dT%H:%M:%SZ)" || echo "Không có gì thay đổi để commit"
          git remote add origin https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ github.repository }}.git
          git push -f origin data-store   # force push, chỉ giữ 1 commit -> tránh phình repo

      # ---------- 6. Tự kích hoạt job kế tiếp sau khi data đã được upload xong ----------
      - name: Trigger next job
        run: |
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.GH_PAT }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/start.yml/dispatches \
            -d '{"ref":"main"}'
          echo "Triggered next run"
          sleep 300   # sống thêm 5p để job2 kịp connect chisel, giảm gap gần về 0
